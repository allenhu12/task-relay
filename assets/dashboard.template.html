<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1c2230; --muted:#667085; --line:#e4e7ec;
  --accent:#3b6ef5; --ok:#1f9d55; --run:#3b6ef5; --user:#d92d20; --ext:#d98a00; --idle:#98a2b3; --cxl:#7a7f8a;
  --user-bg:#fdecea; --ext-bg:#fff4dc; --ok-bg:#e6f6ec; --run-bg:#e9efff; --idle-bg:#f0f2f5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --panel:#171b23; --text:#e6e9ef; --muted:#98a2b3; --line:#2a303b;
    --accent:#7196ff; --ok:#3ccf7a; --run:#7196ff; --user:#ff6b5e; --ext:#f0b43c; --idle:#6b7483; --cxl:#8a8f99;
    --user-bg:#3a1c1a; --ext-bg:#3a2e14; --ok-bg:#16301f; --run-bg:#1b2645; --idle-bg:#222833;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 8px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.meta{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .n{font-size:22px;font-weight:650}
.kpi .l{color:var(--muted);font-size:12px}
.kpi.user .n{color:var(--user)} .kpi.ext .n{color:var(--ext)}
.bar{height:6px;background:var(--idle-bg);border-radius:4px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.s-pending{background:var(--idle-bg);color:var(--muted)}
.s-in_progress{background:var(--run-bg);color:var(--run)}
.s-completed{background:var(--ok-bg);color:var(--ok)}
.s-blocked{background:var(--user-bg);color:var(--user)}
.s-cancelled{background:var(--idle-bg);color:var(--cxl);text-decoration:line-through}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.bl{border-left:4px solid var(--user)} .bl.ext{border-left-color:var(--ext)}
.bl .who{font-size:11px;font-weight:700;color:var(--user)} .bl.ext .who{color:var(--ext)}
.bl .q{font-weight:600;margin:4px 0}
.bl .d{font-size:12px;color:var(--muted)}
.bl .d b{color:var(--text);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
details.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.item summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:78px 1fr 90px 160px;gap:12px;align-items:center}
details.item summary::-webkit-details-marker{display:none}
details.item[open] summary{border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:8px}.prog .bar{flex:1}.prog small{color:var(--muted);width:34px;text-align:right}
.tasks{list-style:none;margin:0;padding:6px 14px 10px}
.tasks li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;padding:5px 0;align-items:start;border-bottom:1px dashed var(--line)}
.tasks li:last-child{border-bottom:0}
.ic{width:10px;height:10px;border-radius:3px;margin-top:5px}
.i-pending{border:2px solid var(--idle)} .i-in_progress{background:var(--run)} .i-completed{background:var(--ok)}
.i-blocked{background:var(--user)} .i-blocked.ext{background:var(--ext)} .i-cancelled{background:var(--cxl);opacity:.5}
.tnote{font-size:12px;color:var(--muted);display:block}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--muted);font-size:12px;margin-right:8px}
.cap{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
.summaryline{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  details.item summary{grid-template-columns:70px 1fr;}
  details.item summary .prog{grid-column:1/-1}
}
@media (max-width:520px){ .tasks li{grid-template-columns:14px 1fr} .tasks li .mono,.tasks li .chip{display:none} }
</style>
</head>
<body>
<div class="wrap">
{{HEADER}}
{{KPIS}}
{{NEEDS_YOU}}
{{EXTERNAL}}
{{ACTIVE_ITEMS}}
{{ACTIVITY_ROW}}
{{FINISHED}}
</div>
</body>
</html>
