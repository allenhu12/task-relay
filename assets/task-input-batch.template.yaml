---
# Interface 3 — task-input-batch.yaml
# Produced by task-relay's Step 2 decomposition, or by any external
# decomposer. Ingested via the Batch Ingestion workflow.
schema_version: 1

# Set delta: true to apply surgical updates against an existing item-list.
# Omit (or set false) for a full new-item ingestion.
delta: false

# Optional: provenance info preserved into progress.log.
source:
  produced_by: "task-relay-step-2 | external-decomposer | manual"
  produced_at: "YYYY-MM-DDTHH:MM:SSZ"
  design_ref: "10-reference/000_YYYY-MM-DD_spec.md"

items:
  - title: "<short imperative phrase, ≤80 chars>"
    description: |
      <full description, multi-line allowed>
    category: "setup|implementation|testing|documentation|refactor|bugfix"
    priority: 1                    # lower = earlier
    validation_steps:              # item-level rollup checks
      - "<objective check 1>"
      - "<objective check 2>"
    tasks:                         # optional; if absent, a single task is auto-derived
      - description: "<first concrete sub-step>"
        validation_steps:
          - "<task-level check>"
      - description: "<second concrete sub-step>"
        validation_steps:
          - "<task-level check>"

  # Delta item-level operations:
  # - op: modify
  #   target: ITEM-005
  #   patch:
  #     description: "<new description>"
  # - op: remove
  #   target: ITEM-007
  #   notes: "<reason for removal / cancellation>"

  # Delta task-level operations:
  # - op: add_task
  #   target: ITEM-005
  #   task:
  #     description: "<new task description>"
  #     validation_steps: ["<check>"]
  # - op: modify_task
  #   target: ITEM-005
  #   task: TASK-005-02
  #   patch:
  #     description: "<updated description>"
  # - op: remove_task
  #   target: ITEM-005
  #   task: TASK-005-03
  #   notes: "<reason>"
