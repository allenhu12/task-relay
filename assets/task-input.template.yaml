---
# Interface 4 — task-input.yaml
# Materialized by the task-relay deep adapter (/task-relay deep ITEM-XXX)
# from a single item in 00-current/item-list.json. Consumed by deep-task,
# which operates inside the named workdir.
schema_version: 1

title: "<item.description, truncated to <=80 chars>"

description: |
  <item.description (full text)>
  Additional notes: <item.notes, if non-empty>

validation_criteria:
  - "<copy from item.validation_criteria / validation_steps verbatim>"
  - "<one entry per criterion>"

references:
  - "10-reference/MANIFEST.md"
  - "10-reference/000_YYYY-MM-DD_spec.md"
  # Add design / spec files matching the item's category.

context_hints:
  preferences_file: "./00-current/memory.md"
  related_items:
    # Copy ITEM-IDs from item.depends_on
    - "ITEM-YYY"

workdir: "./20-working/<ITEM_ID>/"
